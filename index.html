<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemo Search - Smart Web Ecosystem</title>
    <style>
        :root {
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --bg-elevated: #f1f5f9;
            --border-color: #cbd5e1;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent: #0284c7;
            --radius-md: 10px;
            --radius-lg: 16px;
            --shadow-card: 0 4px 20px rgba(15, 23, 42, 0.05);
            --shadow-hover: 0 10px 28px rgba(15, 23, 42, 0.1);
        }

        body.dark-theme {
            --bg-main: #070a12;
            --bg-card: #0f172a;
            --bg-elevated: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.25);
            --shadow-hover: 0 10px 28px rgba(0, 0, 0, 0.45);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-main);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            user-select: none;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        body.has-custom-bg::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(7, 10, 18, 0.5);
            backdrop-filter: blur(4px);
            z-index: 0;
        }

        /* Barre di navigazione superiore */
        .top-bar-left {
            position: fixed;
            top: 20px;
            left: 20px;
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        .top-bar-right {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        .top-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: var(--radius-md);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: var(--shadow-card);
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            transition: all 0.15s ease;
        }
        .top-btn:hover { border-color: var(--accent); transform: translateY(-1px); }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 800px;
            padding: 24px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
        }

        .brand-widget { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .brand-title { font-size: 48px; font-weight: 700; letter-spacing: -1.5px; color: var(--text-main); margin: 0; }
        .brand-subtitle { font-size: 12px; color: var(--text-muted); font-weight: 500; letter-spacing: 1px; text-transform: uppercase; }

        body.has-custom-bg .brand-title { color: #ffffff; text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5); }
        body.has-custom-bg .brand-subtitle { color: #cbd5e1; text-shadow: 0 1px 8px rgba(0, 0, 0, 0.5); }

        .search-container {
            width: 100%;
            max-width: 620px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .search-wrapper {
            display: flex;
            align-items: center;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 6px 12px;
            box-shadow: var(--shadow-card);
            transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
        }

        .search-wrapper:focus-within {
            border-color: var(--accent);
            box-shadow: var(--shadow-hover);
            transform: translateY(-1px);
        }

        #engine-select-btn {
            background: transparent;
            border: none;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: var(--radius-md);
            transition: background 0.1s;
        }
        #engine-select-btn:hover { background: var(--bg-elevated); }
        #engine-icon { width: 18px; height: 18px; object-fit: contain; }

        #web-search-input {
            flex: 1;
            border: none;
            background: transparent;
            color: var(--text-main);
            font-size: 14px;
            padding: 8px 10px;
            outline: none;
        }
        #web-search-input::placeholder { color: var(--text-muted); }

        #search-submit {
            background-color: var(--accent);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-md);
            padding: 8px 16px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.15s ease, transform 0.1s ease;
        }
        #search-submit:hover { opacity: 0.9; }
        #search-submit:active { transform: scale(0.97); }

        .engine-dropdown {
            position: absolute;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-hover);
            display: none;
            flex-direction: column;
            gap: 2px;
            padding: 4px;
            z-index: 50;
            margin-top: 55px;
        }
        .engine-dropdown.open { display: flex; }
        .engine-option {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            font-size: 12px;
            cursor: pointer;
            border-radius: 6px;
            color: var(--text-main);
        }
        .engine-option:hover { background: var(--bg-elevated); }
        .engine-option img { width: 14px; height: 14px; }

        .shortcuts-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 14px;
            width: 100%;
        }

        .shortcut-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 18px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-main);
            box-shadow: var(--shadow-card);
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.2s ease, border-color 0.2s ease;
        }
        .shortcut-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); border-color: var(--accent); }

        .shortcut-icon-box {
            width: 42px; height: 42px;
            border-radius: var(--radius-md);
            background-color: var(--bg-main);
            border: 1px solid var(--border-color);
            display: flex; align-items: center; justify-content: center;
        }
        .shortcut-card:hover .shortcut-icon-box { transform: scale(1.06); }
        .shortcut-icon-box img { width: 24px; height: 24px; object-fit: contain; }
        .shortcut-label { font-size: 12px; font-weight: 500; color: var(--text-main); white-space: nowrap; }

        .side-drawer {
            position: fixed; top: 0; right: -340px; width: 320px; height: 100vh;
            background-color: var(--bg-card); border-left: 1px solid var(--border-color);
            z-index: 100; transition: right 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; flex-direction: column; padding: 20px; box-sizing: border-box;
            box-shadow: -12px 0 30px rgba(0,0,0,0.15);
        }
        .side-drawer.open { right: 0; }
        .drawer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .drawer-header h3 { margin: 0; font-size: 14px; font-weight: 600; color: var(--text-main); }
        
        .settings-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
        .settings-group label { font-size: 12px; font-weight: 500; color: var(--text-muted); }
        .settings-group input {
            background: var(--bg-main); color: var(--text-main); border: 1px solid var(--border-color);
            padding: 8px; border-radius: var(--radius-md); font-size: 12px; outline: none;
        }
        .drawer-btn {
            background: var(--accent); color: #fff; border: none; padding: 8px; border-radius: var(--radius-md);
            font-size: 12px; font-weight: 500; cursor: pointer; transition: opacity 0.15s;
        }
        .drawer-btn:hover { opacity: 0.9; }

        @media (max-width: 680px) {
            .shortcuts-grid { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>

    <!-- Pulsante Download spostato a sinistra -->
    <div class="top-bar-left">
        <a class="top-btn" href="download.html">📥 Scarica App</a>
    </div>

    <!-- Pulsanti Personalizza e Tema a destra -->
    <div class="top-bar-right">
        <button class="top-btn" id="settings-btn">⚙️ Personalizza</button>
        <button class="top-btn" id="theme-btn">🌓 Tema</button>
    </div>

    <div class="container">
        <div class="brand-widget">
            <h1 class="brand-title">Gemo Search</h1>
            <span class="brand-subtitle">Smart Web Ecosystem</span>
        </div>

        <div class="search-container">
            <div class="search-wrapper">
                <button id="engine-select-btn" title="Cambia motore di ricerca">
                    <img id="engine-icon" src="https://www.google.com/s2/favicons?domain=google.com&sz=128" alt="Motore">
                    <span>▼</span>
                </button>
                <input type="text" id="web-search-input" placeholder="Cerca sul web o inserisci un URL..." autofocus />
                <button id="search-submit">Cerca</button>
            </div>

            <div class="engine-dropdown" id="engine-dropdown">
                <div class="engine-option" data-engine="google" data-domain="google.com" data-url="https://www.google.com/search?q=">
                    <img src="https://www.google.com/s2/favicons?domain=google.com&sz=128"> Google
                </div>
                <div class="engine-option" data-engine="duckduckgo" data-domain="duckduckgo.com" data-url="https://duckduckgo.com/?q=">
                    <img src="https://www.google.com/s2/favicons?domain=duckduckgo.com&sz=128"> DuckDuckGo
                </div>
                <div class="engine-option" data-engine="bing" data-domain="bing.com" data-url="https://www.bing.com/search?q=">
                    <img src="https://www.google.com/s2/favicons?domain=bing.com&sz=128"> Bing
                </div>
                <div class="engine-option" data-engine="wikipedia" data-domain="it.wikipedia.org" data-url="https://it.wikipedia.org/w/index.php?search=">
                    <img src="https://www.google.com/s2/favicons?domain=it.wikipedia.org&sz=128"> Wikipedia
                </div>
            </div>
        </div>

        <div class="shortcuts-grid">
            <a class="shortcut-card" href="https://www.google.com" target="_blank">
                <div class="shortcut-icon-box"><img src="https://www.google.com/s2/favicons?domain=google.com&sz=128" alt="Google"></div>
                <span class="shortcut-label">Google</span>
            </a>
            <a class="shortcut-card" href="https://web.whatsapp.com" target="_blank">
                <div class="shortcut-icon-box"><img src="https://www.google.com/s2/favicons?domain=whatsapp.com&sz=128" alt="WhatsApp"></div>
                <span class="shortcut-label">WhatsApp</span>
            </a>
            <a class="shortcut-card" href="https://www.youtube.com" target="_blank">
                <div class="shortcut-icon-box"><img src="https://www.google.com/s2/favicons?domain=youtube.com&sz=128" alt="YouTube"></div>
                <span class="shortcut-label">YouTube</span>
            </a>
            <a class="shortcut-card" href="https://discord.com/app" target="_blank">
                <div class="shortcut-icon-box"><img src="https://www.google.com/s2/favicons?domain=discord.com&sz=128" alt="Discord"></div>
                <span class="shortcut-label">Discord</span>
            </a>
            <a class="shortcut-card" href="https://chatgpt.com" target="_blank">
                <div class="shortcut-icon-box"><img src="https://www.google.com/s2/favicons?domain=openai.com&sz=128" alt="ChatGPT"></div>
                <span class="shortcut-label">ChatGPT</span>
            </a>
            <a class="shortcut-card" href="https://github.com" target="_blank">
                <div class="shortcut-icon-box"><img src="https://www.google.com/s2/favicons?domain=github.com&sz=128" alt="GitHub"></div>
                <span class="shortcut-label">GitHub</span>
            </a>
        </div>
    </div>

    <!-- Pannello Personalizzazione Sfondo -->
    <div class="side-drawer" id="settings-drawer">
        <div class="drawer-header">
            <h3>Personalizza Sfondo</h3>
            <button class="top-btn" id="close-settings-btn" style="padding: 4px 8px;">✕</button>
        </div>
        <div class="settings-group">
            <label>URL Immagine di Sfondo</label>
            <input type="text" id="bg-url-input" placeholder="https://esempio.com/sfondo.jpg" />
        </div>
        <button class="drawer-btn" id="save-bg-btn">Applica Sfondo</button>
        <button class="drawer-btn" id="reset-bg-btn" style="background: #ef4444; margin-top: 8px;">Rimuovi Sfondo</button>
    </div>

    <script>
        const themeBtn = document.getElementById('theme-btn');
        const isDark = localStorage.getItem('gemo_web_theme') === 'dark';
        if (isDark) document.body.classList.add('dark-theme');

        themeBtn.addEventListener('click', () => {
            const darkNow = document.body.classList.toggle('dark-theme');
            localStorage.setItem('gemo_web_theme', darkNow ? 'dark' : 'light');
        });

        const savedBg = localStorage.getItem('gemo_web_bg');
        if (savedBg) {
            document.body.style.backgroundImage = `url('${savedBg}')`;
            document.body.classList.add('has-custom-bg');
            document.getElementById('bg-url-input').value = savedBg;
        }

        document.getElementById('save-bg-btn').addEventListener('click', () => {
            const url = document.getElementById('bg-url-input').value.trim();
            if (url) {
                localStorage.setItem('gemo_web_bg', url);
                document.body.style.backgroundImage = `url('${url}')`;
                document.body.classList.add('has-custom-bg');
                document.getElementById('settings-drawer').classList.remove('open');
            }
        });

        document.getElementById('reset-bg-btn').addEventListener('click', () => {
            localStorage.removeItem('gemo_web_bg');
            document.body.style.backgroundImage = '';
            document.body.classList.remove('has-custom-bg');
            document.getElementById('bg-url-input').value = '';
            document.getElementById('settings-drawer').classList.remove('open');
        });

        const settingsDrawer = document.getElementById('settings-drawer');
        document.getElementById('settings-btn').addEventListener('click', () => settingsDrawer.classList.add('open'));
        document.getElementById('close-settings-btn').addEventListener('click', () => settingsDrawer.classList.remove('open'));

        const engineSelectBtn = document.getElementById('engine-select-btn');
        const engineDropdown = document.getElementById('engine-dropdown');
        const engineIcon = document.getElementById('engine-icon');
        const searchInput = document.getElementById('web-search-input');

        let currentEngine = JSON.parse(localStorage.getItem('gemo_web_engine')) || {
            name: 'google', domain: 'google.com', url: 'https://www.google.com/search?q='
        };

        engineIcon.src = `https://www.google.com/s2/favicons?domain=${currentEngine.domain}&sz=128`;

        engineSelectBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            engineDropdown.classList.toggle('open');
        });

        document.addEventListener('click', () => engineDropdown.classList.remove('open'));

        document.querySelectorAll('.engine-option').forEach(opt => {
            opt.addEventListener('click', () => {
                currentEngine = {
                    name: opt.getAttribute('data-engine'),
                    domain: opt.getAttribute('data-domain'),
                    url: opt.getAttribute('data-url')
                };
                localStorage.setItem('gemo_web_engine', JSON.stringify(currentEngine));
                engineIcon.src = `https://www.google.com/s2/favicons?domain=${currentEngine.domain}&sz=128`;
                engineDropdown.classList.remove('open');
                searchInput.focus();
            });
        });

        function executeSearch() {
            const query = searchInput.value.trim();
            if (!query) return;

            if (query.startsWith('http://') || query.startsWith('https://')) {
                window.open(query, '_blank');
            } else if (query.includes('.') && !query.includes(' ')) {
                window.open('https://' + query, '_blank');
            } else {
                window.open(currentEngine.url + encodeURIComponent(query), '_blank');
            }
        }

        searchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') executeSearch(); });
        document.getElementById('search-submit').addEventListener('click', executeSearch);
    </script>
</body>
</html>
